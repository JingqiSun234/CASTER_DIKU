version: 20
tasks:
  - task_id: benchmark_a
    dataset: benchmark_a
    role: primary_daily_epidemic_task
    natural_language_query: Forecast daily case counts across 349 graph-node entities from released target histories and origin-available daily mobility summaries, at direct horizons of 1 and 3 days and a recursive horizon of 7 days.
    target_components: [cases]
    cadence: daily
    entity_scope: 349 official EpiLLM graph-node entities
    direct_horizons: [1, 3]
    recursive_horizons: [7]
    forecast_strategies: [direct, recursive_rollout]
    posterior_scope: one_task_posterior
    component_weights: {cases: 1.0}
    strategy_weights: {direct: 0.5, recursive_rollout: 0.5}
    horizon_weights:
      direct: {1: 0.5, 3: 0.5}
      recursive_rollout: {7: 1.0}
    selection_fold_policy: one_validation_forecast_origin_per_fold_equal_weight
    candidate_selection_cutoff_policy: max_validation_label_release_before_first_test_origin
    initial_context_policy: {history_scope: all_available_before_t_sel, seasonality_lag: 7}
    t_sel: '2020-04-30'
    t_test: '2020-05-01'
  - task_id: benchmark_b_pooled
    dataset: benchmark_b
    role: pooled_shared_posterior_sensitivity
    frozen_hash_role: primary_multistream_benchmark_b
    natural_language_query: Forecast weekly COVID-19 and influenza hospital admissions per 100000 across 51 jurisdictions from released target and auxiliary streams, at direct horizons of 1 and 2 weeks and a recursive horizon of 4 weeks.
    target_components: [covid_adm_per100k, flu_adm_per100k]
    cadence: weekly
    entity_scope: 51 US jurisdictions
    direct_horizons: [1, 2]
    recursive_horizons: [4]
    forecast_strategies: [direct, recursive_rollout]
    posterior_scope: pooled_shared_posterior
    component_weights: {covid_adm_per100k: 0.5, flu_adm_per100k: 0.5}
    strategy_weights: {direct: 0.5, recursive_rollout: 0.5}
    horizon_weights:
      direct: {1: 0.5, 2: 0.5}
      recursive_rollout: {4: 1.0}
    selection_fold_policy: one_validation_forecast_origin_per_fold_equal_weight
    candidate_selection_cutoff_policy: released_validation_labels_ingested_before_same_time_first_embargo_forecast
    initial_context_policy: {history_scope: all_available_before_t_sel, seasonality_lag: 8, cross_stream_scope: all_available_before_t_sel}
    t_sel: '2025-08-23'
    t_test: '2025-09-20'
  - task_id: benchmark_b_covid
    dataset: benchmark_b
    role: primary_component_filtering_task
    frozen_hash_role: component_conditioned_sensitivity
    natural_language_query: Forecast weekly COVID-19 hospital admissions per 100000 across 51 jurisdictions from released COVID-19 target history and released influenza auxiliary history, at direct horizons of 1 and 2 weeks and a recursive horizon of 4 weeks.
    target_components: [covid_adm_per100k]
    cadence: weekly
    entity_scope: 51 US jurisdictions
    direct_horizons: [1, 2]
    recursive_horizons: [4]
    forecast_strategies: [direct, recursive_rollout]
    posterior_scope: component_conditioned_posterior
    component_weights: {covid_adm_per100k: 1.0}
    strategy_weights: {direct: 0.5, recursive_rollout: 0.5}
    horizon_weights:
      direct: {1: 0.5, 2: 0.5}
      recursive_rollout: {4: 1.0}
    selection_fold_policy: one_validation_forecast_origin_per_fold_equal_weight
    candidate_selection_cutoff_policy: max_validation_label_release_before_first_test_origin
    initial_context_policy: {history_scope: all_available_before_t_sel, seasonality_lag: 8}
    t_sel: '2025-08-23'
    t_test: '2025-09-20'
  - task_id: benchmark_b_flu
    dataset: benchmark_b
    role: primary_component_filtering_task
    frozen_hash_role: component_conditioned_sensitivity
    natural_language_query: Forecast weekly influenza hospital admissions per 100000 across 51 jurisdictions from released influenza target history and released COVID-19 auxiliary history, at direct horizons of 1 and 2 weeks and a recursive horizon of 4 weeks.
    target_components: [flu_adm_per100k]
    cadence: weekly
    entity_scope: 51 US jurisdictions
    direct_horizons: [1, 2]
    recursive_horizons: [4]
    forecast_strategies: [direct, recursive_rollout]
    posterior_scope: component_conditioned_posterior
    component_weights: {flu_adm_per100k: 1.0}
    strategy_weights: {direct: 0.5, recursive_rollout: 0.5}
    horizon_weights:
      direct: {1: 0.5, 2: 0.5}
      recursive_rollout: {4: 1.0}
    selection_fold_policy: one_validation_forecast_origin_per_fold_equal_weight
    candidate_selection_cutoff_policy: max_validation_label_release_before_first_test_origin
    initial_context_policy: {history_scope: all_available_before_t_sel, seasonality_lag: 8}
    t_sel: '2025-08-23'
    t_test: '2025-09-20'
